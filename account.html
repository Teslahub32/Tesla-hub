<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Tesla Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      text-decoration: none;
      color: white;
    }

    .logo span {
      color: #ef4444;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 50px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .welcome {
      color: #aaa;
      margin-bottom: 40px;
    }

    .info-box {
      background: #111;
      border-radius: 16px;
      padding: 40px 30px;
      margin-bottom: 40px;
    }

    .info-box h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .info-box p {
      color: #ccc;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      display: block;
      padding: 15px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .btn-primary {
      background: white;
      color: black;
    }

    .btn-primary:hover {
      background: #ddd;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #444;
      color: white;
    }

    .btn-secondary:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 14px;
      border-top: 1px solid #222;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo"><span>T</span>esla Hub</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <h1>My Account</h1>
    <p class="welcome">Welcome back to Tesla Hub</p>

    <div class="info-box" id="userInfo">
      <!-- User info will appear here -->
    </div>

    <div class="buttons">
      <a href="inventory.html" class="btn btn-primary">Browse Inventory</a>
      <a href="chat.html" class="btn btn-secondary">Chat with Admin</a>
      <a href="index.html" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>

  <footer>
    © 2026 Tesla Hub
  </footer>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));

    if (!currentUser) {
      alert('Please login first');
      window.location.href = 'login.html';
    } else {
      document.getElementById('userInfo').innerHTML = `
        <h2>${currentUser.name}</h2>
        <p>${currentUser.email}</p>
      `;
    }

    function logout() {
      localStorage.removeItem('currentUser');
      alert('You have been logged out');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
