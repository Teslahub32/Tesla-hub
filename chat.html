<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Admin - Tesla Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    nav { padding: 18px 30px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: 900; text-decoration: none; color: white; }
    .logo span { color: #ef4444; }
    .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 20px; }
    .chat-header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; }
    .chat-header h1 { font-size: 26px; margin-bottom: 6px; }
    .chat-header p { color: #aaa; font-size: 15px; }
    .messages { flex: 1; overflow-y: auto; padding: 25px 10px; display: flex; flex-direction: column; gap: 18px; }
    .message { max-width: 75%; padding: 14px 18px; border-radius: 18px; line-height: 1.5; font-size: 15px; }
    .admin { background: #1f1f1f; align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: #ef4444; align-self: flex-end; border-bottom-right-radius: 4px; }
    .input-area { display: flex; gap: 12px; padding: 20px 0 10px; border-top: 1px solid #222; }
    .input-area input { flex: 1; padding: 14px 18px; border-radius: 50px; border: 1px solid #333; background: #111; color: white; font-size: 16px; outline: none; }
    .input-area button { background: #ef4444; color: white; border: none; padding: 0 26px; border-radius: 50px; font-weight: bold; cursor: pointer; }
    .confirm-btn { display: none; margin-top: 15px; text-align: center; }
    .confirm-btn a { display: inline-block; background: #16a34a; color: white; padding: 14px 32px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 16px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo"><span>T</span>esla Hub</a>
    <a href="inventory.html" style="color:#ccc; text-decoration:none;">Back to Inventory</a>
  </nav>

  <div class="chat-container">
    <div class="chat-header">
      <h1>Chat with Admin</h1>
      <p>Discuss payment & reservation details</p>
    </div>

    <div class="messages" id="messages">
      <div class="message admin">
        Hello! Welcome to Tesla Hub.<br>
        How can I help you with your payment or reservation today?
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>

    <div class="confirm-btn" id="confirmBtn">
      <a href="confirmation.html">I am ready – Confirm Reservation</a>
    </div>
  </div>

  <script>
    let messageCount = 0;
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text === '') return;

      const messages = document.getElementById('messages');
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = text;
      messages.appendChild(userMsg);

      input.value = '';
      messages.scrollTop = messages.scrollHeight;
      messageCount++;

      if (messageCount >= 2) {
        document.getElementById('confirmBtn').style.display = 'block';
      }

      setTimeout(() => {
        const adminMsg = document.createElement('div');
        adminMsg.className = 'message admin';
        adminMsg.innerHTML = getAdminReply(text);
        messages.appendChild(adminMsg);
        messages.scrollTop = messages.scrollHeight;
      }, 900);
    }

    function getAdminReply(userText) {
      const lower = userText.toLowerCase();
      if (lower.includes('pay') || lower.includes('payment') || lower.includes('price')) {
        return "For payment, I will guide you step by step. Which model are you interested in?";
      }
      if (lower.includes('roadster')) {
        return "The Flying Roadster reservation is $49,999. Would you like to proceed?";
      }
      return "Thank you for your message. Please tell me the model name so I can assist you better.";
    }
  </script>
</body>
</html>
