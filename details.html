<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Admin - Tesla Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; border-bottom: 1px solid #222; background: #000; }
    .logo { font-size: 24px; font-weight: 900; text-decoration: none; color: white; }
    .logo span { color: #ef4444; }
    .nav-links a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 15px; }
    .nav-links a:hover { color: #ef4444; }

    .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 20px auto; width: 95%; background: #111; border-radius: 16px; overflow: hidden; border: 1px solid #222; }

    .chat-header { background: #1a1a1a; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .chat-header h2 { font-size: 20px; }
    .status { color: #22c55e; font-size: 14px; }

    .messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; min-height: 400px; max-height: 500px; background: #0d0d0d; }

    .message { max-width: 75%; padding: 12px 18px; border-radius: 18px; line-height: 1.5; font-size: 15px; }
    .admin { background: #222; align-self: flex-start; border-bottom-left-radius: 5px; }
    .user { background: #ef4444; align-self: flex-end; border-bottom-right-radius: 5px; }

    .input-area { display: flex; gap: 12px; padding: 18px; background: #1a1a1a; border-top: 1px solid #333; }
    .input-area input { flex: 1; padding: 14px 20px; border: none; border-radius: 50px; background: #222; color: white; outline: none; font-size: 15px; }
    .input-area button { background: #ef4444; color: white; border: none; padding: 14px 28px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 15px; }
    .input-area button:hover { background: #dc2626; }

    .clear-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
    .clear-btn:hover { border-color: #ef4444; color: #ef4444; }

    footer { text-align: center; padding: 15px; color: #666; font-size: 14px; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo"><span>T</span>esla Hub</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="inventory.html">Inventory</a>
      <a href="faq.html">FAQ</a>
    </div>
  </nav>

  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h2>Chat with Admin</h2>
        <div class="status">● Online</div>
      </div>
      <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="messages" id="messages">
      <div class="message admin">
        Hello! Welcome to Tesla Hub. How can I help you today? (Payment, Reservation, Model questions...)
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKey(event)">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <footer>© 2026 Tesla Hub</footer>

  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('messageInput');

    const adminReplies = [
      "Thank you for your message. How can I assist you further?",
      "For payment or reservation, please tell me which model you're interested in.",
      "I can help you with Model 3, Model Y, Model X, Model S, or the Flying Roadster.",
      "Please share more details so I can assist you better.",
      "Got it! Let me know if you need anything else.",
      "Would you like me to explain the payment plans?"
    ];

    function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;

      addMessage(text, 'user');
      input.value = "";

      setTimeout(() => {
        const reply = adminReplies[Math.floor(Math.random() * adminReplies.length)];
        addMessage(reply, 'admin');
      }, 900 + Math.random() * 800);
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function clearChat() {
      messagesDiv.innerHTML = `
        <div class="message admin">
          Hello! Welcome to Tesla Hub. How can I help you today? (Payment, Reservation, Model questions...)
        </div>
      `;
    }
  </script>

  s0.parentNode.insertBefore(s1,s0);
  })();
  </script>
  <!--End of Tawk.to Script-->

</body>
</html>
