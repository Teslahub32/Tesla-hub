<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Tesla Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .logo span { color: #ef4444; }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }
    .form-box {
      background: #111;
      padding: 35px 30px;
      border-radius: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #000;
      color: white;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #ef4444;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #dc2626;
    }
    .bottom-text {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #aaa;
    }
    .bottom-text a {
      color: #ef4444;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span>T</span>esla Hub</div>
    <p class="subtitle">Create your account</p>

    <div class="form-box">
      <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="Enter your full name">

        <label>Email</label>
        <input type="email" id="email" required placeholder="Enter your email">

        <label>Password</label>
        <input type="password" id="password" required minlength="6" placeholder="Create a password">

        <button type="submit">Create Account</button>
      </form>
    </div>

    <p class="bottom-text">
      Already have an account? <a href="login.html">Login here</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      let users = JSON.parse(localStorage.getItem('teslaUsers')) || [];

      if (users.find(user => user.email === email)) {
        alert('This email is already registered!');
        return;
      }

      users.push({ name, email, password });
      localStorage.setItem('teslaUsers', JSON.stringify(users));

      alert('Account created successfully! You can now login.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
